# Publica o app e as regras sem precisar de computador: Actions › Publicar › Run workflow.
# Configure em Settings › Secrets and variables › Actions:
#   Secret   FIREBASE_SERVICE_ACCOUNT  conteúdo do JSON da conta de serviço (papel "Administrador do Firebase")
#   Variable FIREBASE_PROJECT_ID       ID do projeto Firebase (ex.: meu-ponto-123)
# Para o notificador dos lembretes (opcional; sem eles, só o app é publicado):
#   Secret   CLOUDFLARE_API_TOKEN      token "Edit Cloudflare Workers"
#   Secret   CLOUDFLARE_ACCOUNT_ID     ID da conta Cloudflare
#   Secret   RUN_KEY                   senha (16+ caracteres) para testar o notificador em /run
#   Secret   NOTIFIER_SERVICE_ACCOUNT  (opcional) JSON de uma conta só para o notificador; sem ele usa FIREBASE_SERVICE_ACCOUNT
name: Publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'firestore.rules', 'firebase.json', 'notifier/**', 'wrangler.toml']

permissions:
  contents: read

concurrency: { group: publicar, cancel-in-progress: false }

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  firebase:
    name: App e regras (Firebase)
    needs: testes
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Conferir segredo e projeto
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJ: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          if [ -z "$PROJ" ]; then echo "::error::Falta a variável FIREBASE_PROJECT_ID"; exit 1; fi
          umask 077
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1]))" "$RUNNER_TEMP/sa.json" || { echo "::error::O segredo não é um JSON válido"; exit 1; }
          # Mostra só a identificação da conta (não é segredo) para conferir no IAM.
          node -e '
            const sa = JSON.parse(require("fs").readFileSync(process.argv[1]));
            const proj = process.argv[2];
            console.log("Conta de serviço: " + sa.client_email);
            console.log("Projeto do JSON:  " + sa.project_id);
            if (sa.type !== "service_account" || !sa.private_key) {
              console.log("::error::O JSON não é uma chave de conta de serviço (falta type/private_key).");
              process.exit(1);
            }
            if (sa.project_id !== proj) {
              console.log("::error::O JSON é do projeto \"" + sa.project_id + "\", não de \"" + proj + "\". Gere a chave no projeto " + proj + " e troque o secret FIREBASE_SERVICE_ACCOUNT.");
              process.exit(1);
            }
            console.log("Dê a esta conta o papel \"Administrador do Firebase\" em: https://console.cloud.google.com/iam-admin/iam?project=" + proj);
          ' "$RUNNER_TEMP/sa.json" "$PROJ"
      - name: Publicar no Firebase
        run: npx -y firebase-tools@13.29.1 deploy --only hosting,firestore:rules --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
      - run: rm -f "$RUNNER_TEMP/sa.json"
        if: always()

  notificador:
    name: Notificador dos lembretes (Cloudflare)
    needs: testes
    runs-on: ubuntu-latest
    environment: producao
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.CF != ''
      - name: Conferir segredos
        if: env.CF != ''
        env:
          RK: ${{ secrets.RUN_KEY }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$ACC" ]; then echo "::error::Falta o segredo CLOUDFLARE_ACCOUNT_ID"; exit 1; fi
          if [ ${#RK} -lt 16 ]; then echo "::error::O segredo RUN_KEY precisa ter pelo menos 16 caracteres"; exit 1; fi
      - name: Publicar o Worker
        if: env.CF != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            FIREBASE_SERVICE_ACCOUNT
            RUN_KEY
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.NOTIFIER_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT }}
          RUN_KEY: ${{ secrets.RUN_KEY }}
      - if: env.CF == ''
        run: echo "Sem CLOUDFLARE_API_TOKEN, o notificador não foi publicado (os lembretes não serão enviados)."
