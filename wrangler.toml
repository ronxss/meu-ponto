# Notificador no Cloudflare Workers (plano gratuito). Veja o README.
name = "meu-ponto-notificador"
main = "notifier/worker.mjs"
compatibility_date = "2026-11-01"
# Sem endereço público: o Worker só roda pelo agendamento (mais seguro e não exige subdomínio workers.dev).
# Para usar o teste por /run, registre um subdomínio em Workers e Pages e troque para true.
workers_dev = false

[triggers]
crons = ["* * * * *"]

[vars]
# Endereço do app (o toque na notificação abre ele).
APP_URL = "https://meu-ponto-a8137.web.app/"
